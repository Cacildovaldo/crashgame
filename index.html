<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Troll Flappy</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Impact&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #222;
            overflow: hidden;
            font-family: 'Impact', 'Arial Black', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        #gameCanvas {
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
            display: block;
            box-shadow: 0 0 30px rgba(0,0,0,0.6);
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            text-align: center;
            color: white;
            text-shadow: 4px 4px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
        }

        .ui-layer.active {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
        }

        .game-title {
            font-size: 4.5rem;
            margin-bottom: 10px;
            color: #ffeb3b;
            letter-spacing: 2px;
            animation: bounce 1.5s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
        }

        .subtitle {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1rem;
            color: #fff;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0 #000;
            font-weight: bold;
        }

        .btn {
            margin-top: 15px;
            padding: 15px 40px;
            font-size: 1.8rem;
            font-family: 'Impact', 'Arial Black', sans-serif;
            color: #fff;
            background: linear-gradient(to bottom, #ff5722, #e64a19);
            border: 4px solid #fff;
            border-radius: 15px;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.1s;
            text-shadow: 3px 3px 0 #000;
            box-shadow: 0 6px 0 #bf360c, 0 10px 10px rgba(0,0,0,0.3);
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #bf360c, 0 4px 4px rgba(0,0,0,0.3);
        }

        #scoreDisplay {
            position: absolute;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 5rem;
            font-weight: bold;
            color: white;
            text-shadow: 4px 4px 0 #000;
            z-index: 10;
            pointer-events: none;
        }

        #credits {
            position: absolute;
            bottom: 25px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1rem;
            color: #ffeb3b;
            text-shadow: 2px 2px 0 #000;
            width: 100%;
            text-align: center;
            font-weight: bold;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            .game-title { font-size: 3.2rem; }
            .btn { font-size: 1.4rem; padding: 12px 30px; }
            #scoreDisplay { font-size: 4rem; top: 12%; }
            .subtitle { font-size: 0.9rem; padding: 0 20px; }
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    
    <div id="scoreDisplay" class="hidden">0</div>

    <!-- Tela Inicial -->
    <div id="startScreen" class="ui-layer active">
        <h1 class="game-title">TROLL FLAPPY</h1>
        <p class="subtitle">Pressione ESPAÇO ou toque na tela para pular</p>
        <button class="btn" id="startBtn">JOGAR</button>
        <div id="credits">Créditos: Rodrigo Bastos</div>
    </div>

    <!-- Tela de Game Over -->
    <div id="gameOverScreen" class="ui-layer hidden">
        <h1 class="game-title" style="color: #ff5252; animation: none;">GAME OVER</h1>
        <p class="subtitle">Pontuação: <span id="finalScore" style="color: #ffeb3b; font-size: 1.5rem;">0</span></p>
        <p class="subtitle">Recorde: <span id="bestScore" style="color: #4caf50; font-size: 1.5rem;">0</span></p>
        <button class="btn" id="restartBtn">TENTAR DE NOVO</button>
        <div id="credits">Créditos: Rodrigo Bastos</div>
    </div>

    <script>
        /**
         * TROLL FLAPPY - Versão Aprimorada
         * Créditos: Rodrigo Bastos
         * 100% Offline, pronto para compilação APK
         */

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Elementos da UI
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const finalScoreEl = document.getElementById('finalScore');
        const bestScoreEl = document.getElementById('bestScore');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');

        // Estado do Jogo
        let gameState = 'MENU';
        let frames = 0;
        let score = 0;
        let bestScore = localStorage.getItem('trollFlappyBest') || 0;
        let gameSpeed = 3;
        let pipeGap = 150;

        // Carregar o Trollface via SVG Base64 (100% Offline e nítido em qualquer resolução)
        const trollfaceSVG = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
            <path d="M100 30 C 60 30, 30 60, 30 100 C 30 150, 60 180, 100 180 C 140 180, 170 150, 170 100 C 170 60, 140 30, 100 30 Z" fill="#ffffff" stroke="#000000" stroke-width="4"/>
            <path d="M 60 55 Q 100 45 140 55" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
            <path d="M 70 70 Q 100 60 130 70" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
            <path d="M 50 85 Q 70 65 90 85 Q 70 105 50 85 Z" fill="#000000"/>
            <path d="M 110 85 Q 130 65 150 85 Q 130 105 110 85 Z" fill="#000000"/>
            <path d="M 90 100 L 110 100 L 100 120 Z" fill="#000000"/>
            <path d="M 35 120 Q 100 180 165 120 Q 140 150 100 150 Q 60 150 35 120 Z" fill="#ffffff" stroke="#000000" stroke-width="3"/>
            <path d="M 35 120 Q 45 110 55 120" fill="none" stroke="#000000" stroke-width="2"/>
            <path d="M 145 120 Q 155 110 165 120" fill="none" stroke="#000000" stroke-width="2"/>
            <path d="M 85 155 Q 100 165 115 155" fill="none" stroke="#000000" stroke-width="2"/>
        </svg>`;
        const trollfaceImg = new Image();
        trollfaceImg.src = 'data:image/svg+xml;base64,' + btoa(trollfaceSVG);

        // Jogador
        const player = {
            x: 50,
            y: 150,
            radius: 22,
            velocity: 0,
            gravity: 0.45,
            jumpStrength: -7.5,
            rotation: 0
        };

        // Canos e Cenário
        let pipes = [];
        const pipeWidth = 65;
        const pipeSpawnRate = 110;
        
        // Emojis do cenário
        let clouds = [];
        let groundDecorations = [];
        const cloudEmojis = ['☁️', '⛅', '🌤️', '☀️'];
        const groundEmojis = ['🌱', '🌿', '🌼', '🍀', '🌾'];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.x = canvas.width * 0.2;
            initScenario();
        }
        
        function initScenario() {
            clouds = [];
            groundDecorations = [];
            // Gerar nuvens iniciais
            for (let i = 0; i < 5; i++) {
                clouds.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * (canvas.height * 0.4),
                    size: 30 + Math.random() * 40,
                    speed: 0.3 + Math.random() * 0.5,
                    emoji: cloudEmojis[Math.floor(Math.random() * cloudEmojis.length)]
                });
            }
            // Gerar decorações do chão
            const groundY = canvas.height - 25;
            for (let i = 0; i < canvas.width; i += 40) {
                if (Math.random() > 0.4) {
                    groundDecorations.push({
                        x: i + Math.random() * 20,
                        y: groundY + 5,
                        emoji: groundEmojis[Math.floor(Math.random() * groundEmojis.length)],
                        size: 16 + Math.random() * 10
                    });
                }
            }
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawScenario() {
            // Nuvens (Parallax)
            ctx.font = "40px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            clouds.forEach(cloud => {
                ctx.font = `${cloud.size}px Arial`;
                ctx.fillText(cloud.emoji, cloud.x, cloud.y);
                if (gameState === 'PLAYING') {
                    cloud.x -= cloud.speed;
                    if (cloud.x < -50) {
                        cloud.x = canvas.width + 50;
                        cloud.y = Math.random() * (canvas.height * 0.4);
                    }
                }
            });
        }

        function drawGround() {
            // Base do chão
            ctx.fillStyle = '#ded895';
            ctx.fillRect(0, canvas.height - 25, canvas.width, 25);
            
            // Linha de grama
            ctx.fillStyle = '#73bf2e';
            ctx.fillRect(0, canvas.height - 30, canvas.width, 8);
            ctx.strokeStyle = '#558c22';
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - 30);
            ctx.lineTo(canvas.width, canvas.height - 30);
            ctx.stroke();

            // Emojis de decoração do chão
            groundDecorations.forEach(decor => {
                ctx.font = `${decor.size}px Arial`;
                ctx.fillText(decor.emoji, decor.x, decor.y);
                if (gameState === 'PLAYING') {
                    decor.x -= gameSpeed;
                    if (decor.x < -20) {
                        decor.x = canvas.width + 20;
                    }
                }
            });
        }

        function drawPipes() {
            pipes.forEach(pipe => {
                // Gradiente para os canos ficarem mais bonitos
                let gradient = ctx.createLinearGradient(pipe.x, 0, pipe.x + pipeWidth, 0);
                gradient.addColorStop(0, '#558c22');
                gradient.addColorStop(0.5, '#73bf2e');
                gradient.addColorStop(1, '#4a7a1e');
                
                ctx.fillStyle = gradient;
                ctx.strokeStyle = '#2d5016';
                ctx.lineWidth = 3;

                // Cano superior
                ctx.fillRect(pipe.x, 0, pipeWidth, pipe.topHeight);
                ctx.strokeRect(pipe.x, 0, pipeWidth, pipe.topHeight);
                ctx.fillRect(pipe.x - 4, pipe.topHeight - 25, pipeWidth + 8, 25);
                ctx.strokeRect(pipe.x - 4, pipe.topHeight - 25, pipeWidth + 8, 25);

                // Cano inferior
                let bottomY = pipe.topHeight + pipeGap;
                let bottomHeight = canvas.height - bottomY - 25;
                ctx.fillRect(pipe.x, bottomY, pipeWidth, bottomHeight);
                ctx.strokeRect(pipe.x, bottomY, pipeWidth, bottomHeight);
                ctx.fillRect(pipe.x - 4, bottomY, pipeWidth + 8, 25);
                ctx.strokeRect(pipe.x - 4, bottomY, pipeWidth + 8, 25);
            });
        }

        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.rotation);
            // Desenha o Trollface SVG carregado
            ctx.drawImage(trollfaceImg, -player.radius, -player.radius, player.radius * 2, player.radius * 2);
            ctx.restore();
        }

        function jump() {
            if (gameState === 'PLAYING') {
                player.velocity = player.jumpStrength;
                player.rotation = -0.4;
                playSound(400, 'square', 0.1);
            }
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, type, duration) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function updateDifficulty() {
            let level = Math.floor(score / 5);
            gameSpeed = Math.min(8, 3 + (level * 0.4));
            pipeGap = Math.max(95, 150 - (level * 8));
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            frames++;
            player.velocity += player.gravity;
            player.y += player.velocity;
            
            if (player.velocity < 0) {
                player.rotation = Math.max(-0.5, player.rotation - 0.05);
            } else {
                player.rotation = Math.min(1.2, player.rotation + 0.03);
            }

            if (player.y + player.radius >= canvas.height - 30 || player.y - player.radius <= 0) {
                gameOver();
            }

            if (frames % pipeSpawnRate === 0) {
                let minHeight = 60;
                let maxHeight = canvas.height - pipeGap - minHeight - 30;
                let topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1) + minHeight);
                pipes.push({ x: canvas.width, topHeight: topHeight, passed: false });
            }

            for (let i = 0; i < pipes.length; i++) {
                let p = pipes[i];
                p.x -= gameSpeed;

                let playerLeft = player.x - player.radius + 6;
                let playerRight = player.x + player.radius - 6;
                let playerTop = player.y - player.radius + 6;
                let playerBottom = player.y + player.radius - 6;

                let pipeLeft = p.x;
                let pipeRight = p.x + pipeWidth;
                let topPipeBottom = p.topHeight;
                let bottomPipeTop = p.topHeight + pipeGap;

                if (playerRight > pipeLeft && playerLeft < pipeRight) {
                    if (playerTop < topPipeBottom || playerBottom > bottomPipeTop) {
                        gameOver();
                    }
                }

                if (p.x + pipeWidth < player.x && !p.passed) {
                    score++;
                    p.passed = true;
                    scoreDisplay.innerText = score;
                    updateDifficulty();
                    playSound(600, 'sine', 0.1);
                }

                if (p.x + pipeWidth < 0) {
                    pipes.shift();
                    i--;
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawScenario();
            drawPipes();
            drawGround();
            drawPlayer();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            gameState = 'PLAYING';
            score = 0;
            frames = 0;
            gameSpeed = 3;
            pipeGap = 150;
            player.y = canvas.height / 2;
            player.velocity = 0;
            player.rotation = 0;
            pipes = [];
            
            scoreDisplay.innerText = score;
            scoreDisplay.classList.remove('hidden');
            startScreen.classList.add('hidden');
            startScreen.classList.remove('active');
            gameOverScreen.classList.add('hidden');
            gameOverScreen.classList.remove('active');
            
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            playSound(150, 'sawtooth', 0.3);
            
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('trollFlappyBest', bestScore);
            }
            
            finalScoreEl.innerText = score;
            bestScoreEl.innerText = bestScore;
            
            scoreDisplay.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
            gameOverScreen.classList.add('active');
        }

        // Controles
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (gameState === 'MENU' || gameState === 'GAMEOVER') {
                    startGame();
                } else {
                    jump();
                }
            }
        });

        window.addEventListener('touchstart', (e) => {
            if (e.target.tagName !== 'BUTTON') {
                e.preventDefault();
                if (gameState === 'PLAYING') jump();
            }
        }, { passive: false });

        startBtn.addEventListener('click', (e) => { e.stopPropagation(); startGame(); });
        restartBtn.addEventListener('click', (e) => { e.stopPropagation(); startGame(); });

        // Iniciar
        gameLoop();
    </script>
</body>
</html>
