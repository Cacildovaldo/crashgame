<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Troll Flappy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none; /* Previne zoom e scroll no mobile */
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #333;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        #gameCanvas {
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
            display: block;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* Deixa os cliques passarem para o canvas quando necessário */
            text-align: center;
            color: white;
            text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }

        .ui-layer.active {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.6);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #ffeb3b;
        }

        p {
            font-size: 1.2rem;
            margin: 10px 0;
        }

        .btn {
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 1.5rem;
            font-family: inherit;
            font-weight: bold;
            color: #fff;
            background: #ff5722;
            border: 3px solid #fff;
            border-radius: 10px;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.1s;
            text-shadow: 2px 2px 0 #000;
        }

        .btn:active {
            transform: scale(0.95);
            background: #e64a19;
        }

        #scoreDisplay {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 4rem;
            font-weight: bold;
            color: white;
            text-shadow: 3px 3px 0 #000;
            z-index: 10;
            pointer-events: none;
        }

        #credits {
            position: absolute;
            bottom: 20px;
            font-size: 1rem;
            color: #fff;
            text-shadow: 2px 2px 0 #000;
            width: 100%;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        /* Ajustes para telas pequenas */
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .btn { font-size: 1.2rem; padding: 12px 24px; }
            #scoreDisplay { font-size: 3rem; top: 15%; }
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    
    <div id="scoreDisplay" class="hidden">0</div>

    <!-- Tela Inicial -->
    <div id="startScreen" class="ui-layer active">
        <h1>TROLL FLAPPY</h1>
        <p>Pressione ESPAÇO ou toque na tela para pular</p>
        <button class="btn" id="startBtn">JOGAR</button>
        <div id="credits">Créditos: Rodrigo Bastos</div>
    </div>

    <!-- Tela de Game Over -->
    <div id="gameOverScreen" class="ui-layer hidden">
        <h1 style="color: #ff5252;">GAME OVER</h1>
        <p>Pontuação: <span id="finalScore">0</span></p>
        <p>Recorde: <span id="bestScore">0</span></p>
        <button class="btn" id="restartBtn">TENTAR DE NOVO</button>
        <div id="credits">Créditos: Rodrigo Bastos</div>
    </div>

    <script>
        /**
         * TROLL FLAPPY
         * Desenvolvido para ser compilado em APK (Cordova/Capacitor/WebView)
         * Créditos: Rodrigo Bastos
         */

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Elementos da UI
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const finalScoreEl = document.getElementById('finalScore');
        const bestScoreEl = document.getElementById('bestScore');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');

        // Estado do Jogo
        let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER
        let frames = 0;
        let score = 0;
        let bestScore = localStorage.getItem('trollFlappyBest') || 0;
        let gameSpeed = 3;
        let pipeGap = 150;

        // Configurações do Jogador (Trollface)
        const player = {
            x: 50,
            y: 150,
            radius: 20,
            velocity: 0,
            gravity: 0.45,
            jumpStrength: -7.5,
            rotation: 0
        };

        // Canos
        let pipes = [];
        const pipeWidth = 60;
        const pipeSpawnRate = 120; // Frames entre cada cano

        // Ajuste de tamanho do canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.x = canvas.width * 0.2; // Mantém o jogador a 20% da tela
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Função para desenhar o Trollface
        function drawTrollface(x, y, size, rotation) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);

            // Cabeça
            ctx.beginPath();
            ctx.ellipse(0, 0, size, size * 0.85, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Olhos
            ctx.beginPath();
            ctx.ellipse(-size * 0.35, -size * 0.2, size * 0.25, size * 0.35, -0.2, 0, Math.PI * 2);
            ctx.ellipse(size * 0.35, -size * 0.2, size * 0.25, size * 0.35, 0.2, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();

            // Sorriso Troll (icônico)
            ctx.beginPath();
            ctx.moveTo(-size * 0.6, size * 0.1);
            ctx.quadraticCurveTo(0, size * 0.9, size * 0.7, size * 0.0);
            ctx.quadraticCurveTo(size * 0.4, size * 0.4, -size * 0.6, size * 0.1);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.stroke();

            // Nariz
            ctx.beginPath();
            ctx.moveTo(-size * 0.1, size * 0.1);
            ctx.lineTo(size * 0.1, size * 0.1);
            ctx.lineTo(0, size * 0.35);
            ctx.closePath();
            ctx.stroke();

            // Rugas na testa
            ctx.beginPath();
            ctx.moveTo(-size * 0.4, -size * 0.55);
            ctx.lineTo(-size * 0.1, -size * 0.45);
            ctx.moveTo(size * 0.1, -size * 0.5);
            ctx.lineTo(size * 0.4, -size * 0.55);
            ctx.moveTo(-size * 0.2, -size * 0.65);
            ctx.lineTo(size * 0.2, -size * 0.65);
            ctx.stroke();

            ctx.restore();
        }

        // Função para desenhar canos
        function drawPipes() {
            ctx.fillStyle = '#73bf2e';
            ctx.strokeStyle = '#558c22';
            ctx.lineWidth = 3;

            pipes.forEach(pipe => {
                // Cano superior
                ctx.fillRect(pipe.x, 0, pipeWidth, pipe.topHeight);
                ctx.strokeRect(pipe.x, 0, pipeWidth, pipe.topHeight);
                // Borda do cano superior
                ctx.fillRect(pipe.x - 3, pipe.topHeight - 20, pipeWidth + 6, 20);
                ctx.strokeRect(pipe.x - 3, pipe.topHeight - 20, pipeWidth + 6, 20);

                // Cano inferior
                let bottomY = pipe.topHeight + pipeGap;
                let bottomHeight = canvas.height - bottomY;
                ctx.fillRect(pipe.x, bottomY, pipeWidth, bottomHeight);
                ctx.strokeRect(pipe.x, bottomY, pipeWidth, bottomHeight);
                // Borda do cano inferior
                ctx.fillRect(pipe.x - 3, bottomY, pipeWidth + 6, 20);
                ctx.strokeRect(pipe.x - 3, bottomY, pipeWidth + 6, 20);
            });
        }

        // Função para desenhar o chão
        function drawGround() {
            ctx.fillStyle = '#ded895';
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
            ctx.strokeStyle = '#cbb968';
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - 20);
            ctx.lineTo(canvas.width, canvas.height - 20);
            ctx.stroke();
            
            // Detalhe de grama
            ctx.fillStyle = '#73bf2e';
            ctx.fillRect(0, canvas.height - 25, canvas.width, 5);
        }

        // Lógica de pular
        function jump() {
            if (gameState === 'PLAYING') {
                player.velocity = player.jumpStrength;
                player.rotation = -0.4;
                playSound(400, 'square', 0.1);
            }
        }

        // Sistema de áudio simples (Web Audio API) para não depender de arquivos externos
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, type, duration) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // Atualização da dificuldade
        function updateDifficulty() {
            // A cada 5 pontos, aumenta a velocidade e diminui o gap (com limites)
            let level = Math.floor(score / 5);
            gameSpeed = Math.min(8, 3 + (level * 0.4));
            pipeGap = Math.max(90, 150 - (level * 8));
        }

        // Loop principal do jogo
        function update() {
            if (gameState !== 'PLAYING') return;

            frames++;
            
            // Física do jogador
            player.velocity += player.gravity;
            player.y += player.velocity;
            
            // Rotação baseada na velocidade
            if (player.velocity < 0) {
                player.rotation = Math.max(-0.5, player.rotation - 0.05);
            } else {
                player.rotation = Math.min(1.2, player.rotation + 0.03);
            }

            // Colisão com o chão ou teto
            if (player.y + player.radius >= canvas.height - 25 || player.y - player.radius <= 0) {
                gameOver();
            }

            // Gerenciamento de canos
            if (frames % pipeSpawnRate === 0) {
                let minHeight = 50;
                let maxHeight = canvas.height - pipeGap - minHeight - 25;
                let topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1) + minHeight);
                pipes.push({
                    x: canvas.width,
                    topHeight: topHeight,
                    passed: false
                });
            }

            for (let i = 0; i < pipes.length; i++) {
                let p = pipes[i];
                p.x -= gameSpeed;

                // Colisão com canos
                // Caixa de colisão do jogador (simplificada para retângulo)
                let playerLeft = player.x - player.radius + 5;
                let playerRight = player.x + player.radius - 5;
                let playerTop = player.y - player.radius + 5;
                let playerBottom = player.y + player.radius - 5;

                let pipeLeft = p.x;
                let pipeRight = p.x + pipeWidth;
                let topPipeBottom = p.topHeight;
                let bottomPipeTop = p.topHeight + pipeGap;

                if (playerRight > pipeLeft && playerLeft < pipeRight) {
                    if (playerTop < topPipeBottom || playerBottom > bottomPipeTop) {
                        gameOver();
                    }
                }

                // Pontuação
                if (p.x + pipeWidth < player.x && !p.passed) {
                    score++;
                    p.passed = true;
                    scoreDisplay.innerText = score;
                    updateDifficulty();
                    playSound(600, 'sine', 0.1);
                }

                // Remover canos fora da tela
                if (p.x + pipeWidth < 0) {
                    pipes.shift();
                    i--;
                }
            }
        }

        function draw() {
            // Limpar tela
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Desenhar canos
            drawPipes();

            // Desenhar chão
            drawGround();

            // Desenhar jogador (Trollface)
            drawTrollface(player.x, player.y, player.radius, player.rotation);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            gameState = 'PLAYING';
            score = 0;
            frames = 0;
            gameSpeed = 3;
            pipeGap = 150;
            player.y = canvas.height / 2;
            player.velocity = 0;
            player.rotation = 0;
            pipes = [];
            
            scoreDisplay.innerText = score;
            scoreDisplay.classList.remove('hidden');
            startScreen.classList.add('hidden');
            startScreen.classList.remove('active');
            gameOverScreen.classList.add('hidden');
            gameOverScreen.classList.remove('active');
            
            // Iniciar contexto de áudio no primeiro interação do usuário
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            playSound(150, 'sawtooth', 0.3);
            
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('trollFlappyBest', bestScore);
            }
            
            finalScoreEl.innerText = score;
            bestScoreEl.innerText = bestScore;
            
            scoreDisplay.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
            gameOverScreen.classList.add('active');
        }

        // Controles
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault(); // Previne scroll da página
                if (gameState === 'MENU' || gameState === 'GAMEOVER') {
                    startGame();
                } else {
                    jump();
                }
            }
        });

        // Controles de toque (Mobile)
        window.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Previne zoom e scroll
            if (gameState === 'MENU' || gameState === 'GAMEOVER') {
                // Só inicia se tocar no botão, mas para facilitar no mobile, 
                // tocarmos na tela também pode iniciar, exceto se for no botão (que tem seu próprio listener)
            } else {
                jump();
            }
        }, { passive: false });

        startBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startGame();
        });

        restartBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startGame();
        });

        // Iniciar loop
        gameLoop();

    </script>
</body>
</html>
